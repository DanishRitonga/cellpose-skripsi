[project]
name = "cellpose-skripsi"
version = "0.1.0"
description = "Cellpose nucleus segmentation fine-tuned on PanNuke"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cellpose",
    "datasets",
    "numpy",
    "scipy",
    "tifffile",
    "tqdm",
    "Pillow",
]

[project.scripts]
cellpose-skripsi = "main:main"
