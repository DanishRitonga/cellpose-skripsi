[project]
name = "cellpose-skripsi"
version = "0.2.0"
description = "Classpose nucleus segmentation and classification fine-tuned on PanNuke"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "classpose @ file:///tmp/opencode/classpose-fixed",
    "datasets",
    "numpy",
    "scipy",
    "tifffile",
    "tqdm",
    "Pillow",
]

[project.scripts]
cellpose-skripsi = "main:main"
